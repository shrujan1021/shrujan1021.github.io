<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1814" />
      <stop offset="1" stop-color="#0c0b0a" />
    </linearGradient>
    <linearGradient id="pl" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f7dcae" />
      <stop offset="0.45" stop-color="#e0a45c" />
      <stop offset="1" stop-color="#c4785a" />
    </linearGradient>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="13" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- ring: rear half -->
  <g transform="rotate(-20 32 32)" fill="none" stroke="#a3907a" stroke-width="3.4">
    <ellipse cx="32" cy="32" rx="25" ry="9" />
  </g>

  <!-- planet -->
  <g clip-path="url(#clip)">
    <circle cx="32" cy="32" r="13" fill="url(#pl)" />
    <path
      d="M17 27c5-2.6 10-3.7 15-3.7s10 1.1 15 3.7v3.3c-5-2.6-10-3.7-15-3.7s-10 1.1-15 3.7z"
      fill="#c4785a"
      opacity=".5"
    />
    <path
      d="M18 37.4c4.6 2.2 9 3.2 14 3.2s9.4-1 14-3.2v3.1c-4.6 2.2-9 3.2-14 3.2s-9.4-1-14-3.2z"
      fill="#fff"
      opacity=".24"
    />
  </g>

  <!-- ring: front half, drawn over the planet -->
  <g transform="rotate(-20 32 32)" fill="none" stroke="#a3907a" stroke-width="3.4">
    <path d="M57 32A25 9 0 0 1 7 32" />
  </g>
</svg>
